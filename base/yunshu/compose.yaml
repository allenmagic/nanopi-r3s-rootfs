services:
  yunshu:
    image: ${YUNSHU_IMAGE}
    container_name: yunshu
    network_mode: host
    restart: unless-stopped
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    volumes:
      - ${YUNSHU_STATE_DIR}:/var/lib/yunshu
      # 控制面（sp.eagleyun.cn）在隧道建立前就要解析；不能依赖 sing-box/yunshu DNS
      - /etc/yunshu/resolv.conf:/etc/resolv.conf:ro
    environment:
      YUNSHU_CORP_CODE: ${YUNSHU_CORP_CODE}
      YUNSHU_SP_ADDR: ${YUNSHU_SP_ADDR}
