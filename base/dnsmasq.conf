# ============================================================
# dnsmasq.conf —— 出厂默认配置
# ============================================================

# ============================================================
# 1. 监听配置
# ============================================================
# 只监听内网接口（丝印 LAN 口 = 内核 eth0）
interface=eth0

# 绑定动态接口，适应虚拟化环境（PVE）接口启动时序
bind-dynamic

# ============================================================
# 2. 引入模块化配置目录
# ============================================================
conf-dir=/etc/dnsmasq.d/,*.conf
